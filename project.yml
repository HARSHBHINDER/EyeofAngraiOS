name: EyeofAngra
options:
  createIntermediateGroups: true
targets:
  EyeofAngra:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App, Features, Shared, Resources]
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyeofangra.app
        PRODUCT_NAME: EyeofAngra
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Unsigned on purpose. AltStore re-signs with each user's own Apple ID at
        # install time, and 3uTools signs your personal copy. CI has no certificate
        # and needs none.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
