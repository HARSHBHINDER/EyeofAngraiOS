name: EyeofAngra
options:
  createIntermediateGroups: true
targets:
  EyeofAngra:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App, Features, Shared, Resources]
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyeofangra.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Read by Info.plist. CI overrides both per run; these are the local default.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Unsigned on purpose. AltStore re-signs with each user's own Apple ID at
        # install time, and 3uTools signs your personal copy.
        CODE_SIGNING_ALLOWED: NO
      dependencies:
        - target: EyeofAngraWidget
          embed: true
  EyeofAngraWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: EyeofAngra
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyeofangra.app.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
